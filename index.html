<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>goBILDA Structural Learning Center</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; color: #333; max-width: 1000px; margin: 0 auto; padding: 20px; background-color: #f4f4f9; }
        h1 { color: #f26522; text-align: center; border-bottom: 3px solid #f26522; padding-bottom: 10px; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 30px; }
        .part-card { background: white; border-radius: 8px; padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); cursor: pointer; transition: transform 0.2s; border-left: 5px solid #f26522; }
        .part-card:hover { transform: translateY(-5px); background: #fffaf0; }
        .part-title { font-weight: bold; font-size: 1.2em; color: #222; margin-bottom: 8px; }
        .part-desc { font-size: 0.9em; color: #666; }
        #detail-view { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 30px; border-radius: 12px; box-shadow: 0 0 20px rgba(0,0,0,0.3); z-index: 100; max-width: 80%; }
        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 99; }
        .close-btn { background: #f26522; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; float: right; }
        .tag { display: inline-block; background: #eee; padding: 2px 8px; border-radius: 10px; font-size: 0.75em; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>goBILDA® Structure: Educational Explorer</h1>
    <p style="text-align:center">Click on a component category to learn about its mechanical application and integration.</p>

    <div class="grid-container" id="parts-grid">
        </div>

    <div id="overlay"></div>
    <div id="detail-view">
        <button class="close-btn" onclick="closeDetail()">Close</button>
        <h2 id="modal-title"></h2>
        <p id="modal-desc"></p>
        <div id="modal-tips"></div>
    </div>

    <script>
        const parts = [
            { title: "U-Channel", desc: "The heavy-duty backbone of the system. Provides three-sided support and internal space for motors and gears.", use: "Main chassis frames, lift arms, and structural boxes." },
            { title: "goRAIL®", desc: "Extruded aluminum with T-slots and the 16mm pattern. Allows for infinitely adjustable mounting along its length.", use: "Linear motion tracks and adjustable bracing." },
            { title: "Beams", desc: "Flat or square structural members used for low-profile connections and bracing.", use: "Linking two parallel channels or creating lightweight levers." },
            { title: "Grid & Pattern Plates", desc: "Large flat surfaces with the goBILDA hole pattern. Ideal for mounting many components in a small area.", use: "Baseplates for electronics, custom gearboxes, or large structural walls." },
            { title: "Brackets", desc: "L-shaped, flat, and specialty angled connectors to join structural members at various orientations.", use: "90-degree corners, cross-bracing, and motor mounting." },
            { title: "Standoffs & Spacers", desc: "Hexagonal or round pillars used to create space between two parts while maintaining structural integrity.", use: "Mounting circuit boards or stacking parallel plates." },
            { title: "Mounts & Clamps", desc: "Specialized components designed to hold motors, servos, or bearings securely to the structure.", use: "Securing a Yellow Jacket Gearmotor into a U-Channel." },
            { title: "Pattern Adaptors", desc: "Bridges the gap between the goBILDA 16mm pattern and other common systems like Actobotics or REV.", use: "Mixing different hardware ecosystems on one robot." }
        ];

        const grid = document.getElementById('parts-grid');

        parts.forEach(part => {
            const card = document.createElement('div');
            card.className = 'part-card';
            card.innerHTML = `
                <div class="part-title">${part.title}</div>
                <div class="part-desc">${part.desc}</div>
                <div class="tag">Structural Component</div>
            `;
            card.onclick = () => showDetail(part);
            grid.appendChild(card);
        });

        function showDetail(part) {
            document.getElementById('modal-title').innerText = part.title;
            document.getElementById('modal-desc').innerText = part.desc;
            document.getElementById('modal-tips').innerHTML = `<strong>Common Application:</strong> ${part.use}`;
            document.getElementById('overlay').style.display = 'block';
            document.getElementById('detail-view').style.display = 'block';
        }

        function closeDetail() {
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('detail-view').style.display = 'none';
        }
    </script>
</body>
</html>
