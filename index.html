<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>goBILDA Structural Learning Center</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; color: #333; max-width: 1200px; margin: 0 auto; padding: 20px; background-color: #f4f4f9; }
        h1 { color: #f26522; text-align: center; border-bottom: 3px solid #f26522; padding-bottom: 10px; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 30px; }
        .part-card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); cursor: pointer; transition: transform 0.2s; border-bottom: 4px solid #f26522; }
        .part-card:hover { transform: translateY(-5px); }
        .part-img { width: 100%; height: 200px; object-fit: contain; background: #fff; padding: 10px; box-sizing: border-box; }
        .part-info { padding: 15px; }
        .part-title { font-weight: bold; font-size: 1.1em; color: #222; margin-bottom: 5px; }
        .part-desc { font-size: 0.85em; color: #666; height: 45px; overflow: hidden; }
        
        /* Modal Styles */
        #detail-view { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 30px; border-radius: 12px; box-shadow: 0 0 30px rgba(0,0,0,0.5); z-index: 100; width: 90%; max-width: 500px; text-align: center; }
        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 99; }
        .modal-img { width: 250px; height: 250px; object-fit: contain; margin-bottom: 20px; }
        .close-btn { background: #f26522; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>

    <h1>goBILDA® Structure: Visual Parts List</h1>
    <p style="text-align:center">Explore the essential building blocks of the goBILDA ecosystem.</p>

    <div class="grid-container" id="parts-grid"></div>

    <div id="overlay" onclick="closeDetail()"></div>
    <div id="detail-view">
        <img id="modal-img" class="modal-img" src="" alt="Part Image">
        <h2 id="modal-title" style="margin-top:0; color:#f26522;"></h2>
        <p id="modal-desc"></p>
        <p id="modal-tips" style="font-style: italic; color: #555;"></p>
        <button class="close-btn" onclick="closeDetail()">Back to Gallery</button>
    </div>

    <script>
        const parts = [
            { 
                title: "U-Channel", 
                desc: "The structural foundation of most builds.", 
                use: "Ideal for robot chassis and robust lift mechanisms.",
                img: "https://cdn11.bigcommerce.com/s-6u969/images/stencil/500x500/products/1239/6840/1120-0005-0168-Product-Photo-1-2__98485.1554411130.jpg" 
            },
            { 
                title: "goRAIL®", 
                desc: "T-Slot extrusion with the 16mm pattern.", 
                use: "Best for adjustable mounting and linear slides.",
                img: "https://cdn11.bigcommerce.com/s-6u969/images/stencil/500x500/products/1256/6797/1109-0001-0288-Product-Photo-1-1__91652.1554305886.jpg" 
            },
            { 
                title: "Flat Beams", 
                desc: "Low profile structural connectors.", 
                use: "Used for bracing or linking components in tight spaces.",
                img: "https://cdn11.bigcommerce.com/s-6u969/images/stencil/500x500/products/1273/6835/1101-0003-0136-Product-Photo-1-1__37775.1554410065.jpg" 
            },
            { 
                title: "Grid Plates", 
                desc: "Large mounting surfaces for complex assemblies.", 
                use: "Perfect for mounting electronics and custom motor layouts.",
                img: "https://cdn11.bigcommerce.com/s-6u969/images/stencil/500x500/products/1301/6920/1131-0001-0001-Product-Photo-1-1__63375.1554418652.jpg" 
            },
            { 
                title: "L-Brackets", 
                desc: "90-degree structural joiners.", 
                use: "Connecting two pieces of channel at a right angle.",
                img: "https://cdn11.bigcommerce.com/s-6u969/images/stencil/500x500/products/1315/6948/1102-0001-0001-Product-Photo-1-1__49567.1554421448.jpg" 
            },
            { 
                title: "Standoffs", 
                desc: "Threaded pillars to create specific gaps.", 
                use: "Spacing apart two parallel plates for gear clearance.",
                img: "https://cdn11.bigcommerce.com/s-6u969/images/stencil/500x500/products/2199/14358/1117-0006-0020-Product-Photo-1-1__34676.1601655184.jpg" 
            },
            { 
                title: "Clamping Mounts", 
                desc: "High-strength friction mounts for tubes/motors.", 
                use: "Securing motors without marring the surface.",
                img: "https://cdn11.bigcommerce.com/s-6u969/images/stencil/500x500/products/1209/16654/1002-0001-0004-Product-Photo-2-1__20822.1627503795.jpg" 
            },
            { 
                title: "Pattern Spacers", 
                desc: "Small shims to maintain the 8mm grid alignment.", 
                use: "Ensuring smooth gear mesh between structural members.",
                img: "https://cdn11.bigcommerce.com/s-6u969/images/stencil/500x500/products/1359/7092/1110-0001-0003-Product-Photo-1-1__38865.1554492163.jpg" 
            }
        ];

        const grid = document.getElementById('parts-grid');

        parts.forEach(part => {
            const card = document.createElement('div');
            card.className = 'part-card';
            card.innerHTML = `
                <img src="${part.img}" class="part-img" alt="${part.title}">
                <div class="part-info">
                    <div class="part-title">${part.title}</div>
                    <div class="part-desc">${part.desc}</div>
                </div>
            `;
            card.onclick = () => showDetail(part);
            grid.appendChild(card);
        });

        function showDetail(part) {
            document.getElementById('modal-img').src = part.img;
            document.getElementById('modal-title').innerText = part.title;
            document.getElementById('modal-desc').innerText = part.desc;
            document.getElementById('modal-tips').innerHTML = `<strong>Engineering Tip:</strong> ${part.use}`;
            document.getElementById('overlay').style.display = 'block';
            document.getElementById('detail-view').style.display = 'block';
        }

        function closeDetail() {
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('detail-view').style.display = 'none';
        }
    </script>
</body>
</html>
